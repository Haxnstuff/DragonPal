name: Build Windows exe

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'windows/**'
      - '.github/workflows/build-exe.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        working-directory: windows
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build DragonPal.exe
        working-directory: windows
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name DragonPal `
            --collect-all pyttsx3 --collect-all comtypes --collect-all pillow run.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: DragonPal-windows
          path: windows/dist/DragonPal.exe
          if-no-files-found: error
